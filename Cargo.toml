[package]
name = "forrenty"
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Ultra-fast terminal BitTorrent client with integrated DPI bypass engine and asymmetric cloud swarm acceleration"
repository = "https://github.com/Aditya-233/Forrenty"
homepage = "https://github.com/Aditya-233/Forrenty"
readme = "README.md"
authors = ["Aditya <https://github.com/Aditya-233>"]
keywords = ["torrent", "bittorrent", "tui", "ratatui", "bypass"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
libc = "0.2.189"
librqbit = { version = "8.1.1", default-features = false, features = ["default-tls"] }
ratatui = "0.30.2"
reqwest = { version = "0.12.28", default-features = false, features = ["gzip", "default-tls", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
url = "2.5.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

